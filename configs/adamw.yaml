# =====================
project: "adamw-experiment"
entity: "wandb_entity"
run: "adamw-run"
# =====================
# Data
# =====================
input_bin: data/fineweb100B/fineweb_train_*.bin
input_val_bin: data/fineweb100B/fineweb_val_*.bin

# =====================
# Optimization / training
# =====================
batch_size: 512
device_batch_size: 16
sequence_length: 1024
sequence_length_eval: 1024
num_iterations: 5100
warmup_iters: 510
warmdown_iters: 1450

# =====================
# Evaluation / logging
# =====================
val_loss_every: 100
val_tokens: 10485760
save_every: 0

# =====================
# Model architecture
# =====================
n_layer: 12
n_head: 6
n_embd: 768

# =====================
# AdamW optimizer
# =====================
weight_decay: 0.1
beta1: 0.9
beta2: 0.95
lr: 2.5e-3
emb_lr_ratio: 16


seed: 101