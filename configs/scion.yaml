project: "scion-experiment"
entity: "wandb_entity"
run: "scion-run"

input_bin: data/fineweb100B/fineweb_train_*.bin
input_val_bin: data/fineweb100B/fineweb_val_*.bin

batch_size: 512
device_batch_size: 16
sequence_length: 1024
sequence_length_eval: 1024
num_iterations: 5100
warmup_iters: 0
warmdown_iters: 1450

val_loss_every: 100
val_tokens: 10485760
save_every: 0

n_layer: 12
n_head: 6
n_embd: 768

unconstrained: false
momentum: 0.1
weight_decay: 0.0

lr_embed: 3.6e-4
lr_matrix: 3.6e-4

scale_embed: 50
scale_matrix: 3000

seed: 101
